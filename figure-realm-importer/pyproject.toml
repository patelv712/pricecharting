[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figure-realm-importer"
version = "0.1.0"
description = "Figure Realm to PriceCharting action-figure import proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "playwright>=1.55,<2",
  "playwright-stealth>=2.0.3,<3",
  "patchright>=1.62.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
figure-realm-poc = "figure_realm_importer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

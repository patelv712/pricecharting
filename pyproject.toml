[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricecharting-quality-checker"
version = "0.1.0"
description = "Multimodal POC for reviewing questionable PriceCharting TCG sales"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2025.1",
  "fastapi>=0.115,<1",
  "Pillow>=10.4,<13",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
pcqc = "pcqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcqc = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
